<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Staff Calendar Login - Loyalty Group Homes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
</head>
<body class="calendar-auth-bg">
  <main class="container py-5">
    <div class="auth-card mx-auto">
      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Loyalty Group Homes logo" class="auth-logo">
        <h1 class="h3 mt-3">Staff Calendar</h1>
        <p class="text-muted mb-0">Private scheduling access</p>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
      {% endwith %}
      {% if not setup_ready %}<div class="alert alert-warning">Admin login has not been configured in the server environment yet.</div>{% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit" {% if not setup_ready %}disabled{% endif %}>Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
