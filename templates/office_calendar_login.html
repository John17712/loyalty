<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Office Calendar Display</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
</head>
<body class="calendar-auth-bg">
  <main class="container py-5">
    <div class="auth-card mx-auto text-center">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="{{ company_name }} logo" class="auth-logo">
      <h1 class="h3 mt-3">Office Calendar Display</h1>
      <p class="text-muted">Enter the private display PIN once on the office screen.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="alert alert-{{ category }} text-start">{{ message }}</div>{% endfor %}
      {% endwith %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="visually-hidden" for="pin">Display PIN</label>
        <input class="form-control form-control-lg text-center mb-3" id="pin" name="pin" type="password" inputmode="numeric" placeholder="Display PIN" required>
        <button class="btn btn-primary btn-lg w-100" type="submit" {% if not setup_ready %}disabled{% endif %}>Open display</button>
      </form>
    </div>
  </main>
</body>
</html>
